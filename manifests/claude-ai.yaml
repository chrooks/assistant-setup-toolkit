# Skills packed for claude.ai (npm run claude-ai).
#
# claude.ai is NOT an install target — there is no Assistant Home to project
# into, no hooks, no rules directory — so this is deliberately not an
# ADR-0002 Preset. What claude.ai does accept:
#   - custom skill ZIPs, uploaded by hand (Settings → Capabilities → Skills),
#     account-wide across web, iOS, and desktop
#   - a pasted preferences text (claude-ai-preferences.md, 1,500-char limit)
#   - Project instructions (~8k chars) + knowledge files (LEXICON.md, PROFILE.md)
# This manifest names which canonical skills make that trip.
#
# Curation rule: knowledge-work skills only. Anything needing the real
# filesystem, git, subagents, or local MCPs stays out:
#   - seed-project, note — need ~/.claude or the repo tree
#   - dev workflow (scope/plan/implement/commit/dev/...) — Claude Code territory
version: 1
skills:
  - grill-me # pure conversation
  - quiz-me # active recall on a topic or Project knowledge
  - wym # concept explainer
  - walkthrough # topic-by-topic breakdown of a doc or answer
  - recap # packages a conversation into recap artifacts
  - visualize # umbrella picker over table/diagram/figure
  - table # md inline; html becomes a claude.ai Artifact
  - diagram # md inline; html becomes a claude.ai Artifact
  - figure # md inline; html becomes a claude.ai Artifact
  - deep-research # degrades to claude.ai native web search (no firecrawl/exa MCPs)
  - idea-to-design # reasons from PROFILE.md — add it as Project knowledge
  - design-audit # reasons from PROFILE.md — add it as Project knowledge
  - nickify # plain-English brief translator
  - ingest # files to the brain via the Athena connector's inbox tools
  - handoff # copyable continuation prompt — carries context to the next session
  - lexicon # capture mode on claude.ai — emits entry blocks / files via Athena, never scaffolds
# External skills — fetched from install.yaml's skill sources at pack time,
# not from canonical/. Layering matches the wizard (canonical wins): if one of
# these is ever vendored into canonical/skills, move it up to `skills` — a
# repo-integrity test flags the shadowing.
externalSkills:
  - grilling # the primitive grill-me wraps — without it grill-me is half a skill
  - writing-beats # mattpocock in-progress writing skills
  - writing-fragments
  - writing-shape
# Connectors enabled on the claude.ai account — listed in TOOLBOX.md so Claude
# knows what's at its disposal. The repo can't detect claude.ai account config;
# update this by hand when connectors change.
connectors:
  Athena: the brain — search, read, and inbox filing for the LLM-Wiki knowledge base
  Context7: current library and API docs — check before answering setup or API questions
  Trek: the travel planner — trips, itineraries, packing, budgets
  Gmail / Google Calendar / Google Drive: mail, calendar, and files
