# Installation Manifest for the Assistant Setup Toolkit
# Lists External Sources the Setup Wizard can fetch and install.
# See LEXICON.md for domain language definitions.

version: 1
externalSources:
  # Matt Pocock's skills, scoped per group. Whole-repo would also pull
  # skills/deprecated/ and their skills/personal/ — abandoned or not ours.
  # Scoping keeps standing updates without that freight, and picks up new
  # skills they add to these groups automatically. in-progress is fetched
  # knowingly half-built; expect churn and rough edges there.
  #
  # Overlaps are safe: payload.ts layers external files first and canonical
  # files last, so a local skills/<name>/SKILL.md always wins. The overlapping
  # skills (grill-me, grill-with-docs, implement, tdd, handoff) keep their
  # local versions; the wizard prints one "local wins" line each.
  #
  # Safe Merge never overwrites an existing file, so upstream updates only
  # propagate on a `--write overwrite` run; use `--write prune` when upstream
  # renames or removes a skill (e.g. writing-great-skills -> writing-for-agents,
  # 2026-07) so the stale copy is deleted.
  #
  # improve-codebase-architecture is deliberately NOT local: upstream moved its
  # vocabulary into codebase-design, added an HTML report, and delegates to
  # grilling and domain-modeling. The local copy could not wrap it (same name,
  # so it shadows rather than delegates), so it was dropped in favour of
  # upstream's. Cost: upstream says CONTEXT.md where this setup says LEXICON.md.
  - id: matt-pocock-engineering
    name: Matt Pocock Skills — engineering
    kind: skill-pack
    url: https://github.com/mattpocock/skills/tree/main/skills/engineering
    default: true
    targets:
      - claude-code
      - codex-cli
    notes:
      - >-
        Supplies domain-modeling, which /grill-with-docs and the doc-writing
        half of a grilling session build on. Disabling this group removes it.
      - >-
        Vendor only what upstream no longer maintains; anything still developed
        belongs in a fetched entry. A vendored copy of a live skill rots
        quietly — that is how the Negation and YAGNI-scoping improvements were
        missed for a month.

  - id: matt-pocock-productivity
    name: Matt Pocock Skills — productivity
    kind: skill-pack
    url: https://github.com/mattpocock/skills/tree/main/skills/productivity
    default: true
    targets:
      - claude-code
      - codex-cli
    notes:
      - >-
        Supplies the grilling primitive that /grill-me and /grill-with-docs
        wrap. Disabling this group breaks both wrappers, so keep it on unless
        you re-vendor grilling deliberately.

  - id: matt-pocock-in-progress
    name: Matt Pocock Skills — in-progress
    kind: skill-pack
    url: https://github.com/mattpocock/skills/tree/main/skills/in-progress
    default: true
    targets:
      - claude-code
      - codex-cli
    notes:
      - >-
        Upstream's half-built skills, fetched knowingly: claude-handoff,
        loop-me, setup-ts-deep-modules, writing-beats, writing-fragments,
        writing-shape (as of 2026-08; skills graduate out of this group —
        wizard to engineering, to-questionnaire and wait-what to productivity,
        batch-grill-me dropped upstream). No name collisions with
        canonical/skills; if one appears, the local copy wins via the normal
        payload layering.

  - id: find-skills
    name: find-skills
    kind: skill
    url: https://github.com/vercel-labs/skills/tree/main/skills/find-skills
    default: true
    targets:
      - claude-code
      - codex-cli

  - id: impeccable
    name: Impeccable
    kind: skill
    url: https://github.com/pbakaus/impeccable/tree/main/plugin/skills/impeccable
    default: true
    targets:
      - claude-code
      - codex-cli
    notes:
      - The repo root is the whole Impeccable project (CLI, extension, demos);
        the distributable skill lives at plugin/skills/impeccable. Point the URL
        at that subpath — the root has no SKILL.md.
      - Alternative native install via `npx skills add pbakaus/impeccable`.

  - id: agent-native-visual-plans
    name: Agent-Native Visual Plans
    kind: skill
    url: https://github.com/BuilderIO/skills
    default: false
    targets:
      - claude-code
      - codex-cli
    installCommands:
      claude-code:
        - npx @agent-native/core@latest skills add visual-plan
      codex-cli:
        - npx @agent-native/core@latest skills add visual-plan -a codex
    notes:
      - Provides /visual-plan and /visual-recap (one command installs both).
      - Disabled by default — both skills are vendored into canonical/skills,
        so they install via the normal projection. Re-enable to pull fresh from
        upstream instead. Keep the vendored copies byte-identical to upstream
        (ADR-0001); flavor behavior lives in the visual-plans Variant, not in
        skill edits.
      - The review surface is chosen per machine by the visual-plans Variant
        (--visual-plans local-files | self-hosted | none). self-hosted uses
        the user's own Plan deployment, whose origin is machine-local ($TOOLKIT_PLAN_ORIGIN);
        local-files uses the skills' no-MCP privacy mode. Never the Builder
        hosted database.

  - id: caveman
    name: Caveman
    kind: plugin
    url: https://github.com/JuliusBrussee/caveman
    default: true
    targets:
      - claude-code
      - codex-cli
    installCommands:
      claude-code:
        - claude plugin marketplace add JuliusBrussee/caveman
        - claude plugin install caveman@caveman
      codex-cli:
        - npx skills add JuliusBrussee/caveman -a codex
    notes:
      - Native plugin install commands from the Caveman README Install section.

  - id: ponytail
    name: Ponytail
    kind: plugin
    url: https://github.com/DietrichGebert/ponytail
    default: true
    targets:
      - claude-code
      - codex-cli
    installCommands:
      claude-code:
        - claude plugin marketplace add DietrichGebert/ponytail
        - claude plugin install ponytail@ponytail
      codex-cli:
        - codex plugin marketplace add DietrichGebert/ponytail
    notes:
      - Decision-ladder plugin that pushes agents to write minimal code
        (commands /ponytail-review and /ponytail-audit).
      - Requires Node.js on PATH for lifecycle hooks; the core skill works
        without it. No API keys or secrets.
      - Claude Code needs the two install commands sent as separate prompts.
      - Codex install finishes interactively under /plugins after the
        marketplace add.

  - id: everything-claude-code
    name: Everything Claude Code
    kind: plugin
    url: https://github.com/affaan-m/everything-claude-code
    default: false
    targets:
      - claude-code
    notes:
      - Disabled by default — it installed ~270 skills, of which only a handful
        were ever used. Those (configure-ecc, consult, deep-research, diagnose,
        note, tdd, make-interfaces-feel-better, security-review,
        improve-codebase-architecture) are vendored into canonical/skills.
        Re-enable to pull the full plugin.
      - >-
        design-an-interface was dropped entirely — /impeccable covers it, and
        upstream had already moved it to skills/deprecated/.

  - id: codex-plugin-cc
    name: Codex for Claude Code
    kind: plugin
    url: https://github.com/openai/codex-plugin-cc/tree/main/plugins/codex
    default: true
    targets:
      - claude-code
    installWhen:
      assistantTargetExists: claude-code
    installCommands:
      claude-code:
        - /plugin marketplace add openai/codex-plugin-cc
        - /plugin install codex@openai-codex
    notes:
      - Monorepo — component dirs live under plugins/codex, not the repo root.
      - Native install (from the README) keeps the `codex:` namespace and the
        codex-rescue subagent; the fetched copy is the flat fallback.

  - id: playwright-mcp
    name: Playwright MCP
    kind: mcp-server
    url: https://github.com/microsoft/playwright-mcp
    default: false
    targets:
      - claude-code
      - codex-cli
    requiresConfirmation: true

  - id: chrome-devtools-mcp
    name: Chrome DevTools MCP
    kind: mcp-server
    url: https://github.com/ChromeDevTools/chrome-devtools-mcp
    default: false
    targets:
      - claude-code
      - codex-cli
    requiresConfirmation: true
    notes:
      - Google's DevTools team. Lets an agent drive a real Chrome — DOM, console,
        network, performance traces — instead of inferring behavior from source.
      - "Install: claude mcp add --scope user chrome-devtools -- npx -y chrome-devtools-mcp@latest --headless=true"
      - Always register with --headless=true — a headed launch pops a Chrome window
        on the user's screen (rules/common/development-workflow.md, headless rule).
      - This is what backs the "target mockup is the acceptance criterion" clause in
        rules/common/development-workflow.md — without a real browser that rule has no
        mechanism. Overlaps playwright-mcp; this one is for inspecting and comparing,
        Playwright for scripted flows.

  - id: context7
    name: Context7
    kind: mcp-server
    url: https://github.com/upstash/context7
    default: false
    targets:
      - claude-code
      - codex-cli
    requiresConfirmation: true
    requiredSecrets:
      - CONTEXT7_API_KEY

  - id: stop-slop
    name: Hardik Pandya — stop-slop
    kind: skill
    url: https://github.com/hardikpandya/stop-slop
    default: true
    targets:
      - claude-code
      - codex-cli
    notes:
      - >-
        Removes AI tells from prose — slop phrases, filler structures, and
        LLM cadence. The repo root is the skill (SKILL.md plus references/).
        Fetched, not vendored: upstream is maintained.

  - id: humanizer
    name: Siqi Chen — humanizer
    kind: skill
    url: https://github.com/blader/humanizer/tree/main/skills/humanizer
    default: true
    targets:
      - claude-code
      - codex-cli
    notes:
      - >-
        Removes signs of AI-generated writing from text. Companion to
        stop-slop — the two overlap on phrases/structures but each catches
        tells the other misses. Scoped to skills/humanizer; the repo root is
        plugin packaging, not the skill.
