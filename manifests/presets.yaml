# Presets for the Assistant Setup Toolkit (ADR-0002).
# A Preset is a named, repo-declared partial Setup Profile keyed by machine
# class. Machines remember only the Preset NAME (in the Install Receipt);
# contents re-resolve from this file every run — edit here, sync everywhere.
# Allowed fields per preset: targets, components, selectedExternalSourceIds,
# variants, writeBehavior. Run flags (--dry-run, --yes, ...) never belong here.
#
# A machine that cannot push (the work laptop) overrides its own Preset in
# manifests/presets.local.yaml — gitignored, merged over this file per field.
# See presets.local.example.yaml and the ADR-0002 amendment.

version: 1
presets:
  work:
    variants:
      visual-plans: local-files
      # ADR-0003: installs canonical/machines/work/rules.md as rules/machine.md.
      # That file is gitignored — author it on the work laptop itself.
      machine: work
    selectedExternalSourceIds: []
  personal:
    variants:
      visual-plans: self-hosted
  hestia:
    variants:
      visual-plans: self-hosted
      # ADR-0003: installs canonical/machines/hestia/rules.md as rules/machine.md
      machine: hestia
  mac:
    variants:
      visual-plans: self-hosted
      # machine Variant also gates canonical/machines/mac/skills/<skill>/ into the payload.
      machine: mac
